<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #EFEAE1;
    --paper-raised: #F7F3EB;
    --ink: #241F1C;
    --ink-soft: #5B5449;
    --line: #D9D0C1;
    --gold: #A8791F;
    --teal: #2F5D62;
    --rose: #9C4A3E;
    --grey: #6B655C;
    --gold-bg: #F1E6CC;
    --teal-bg: #DDE8E7;
    --rose-bg: #F1E0DB;
    --grey-bg: #E5E1D8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 28px 18px 80px; }

  header.top { margin-bottom: 22px; }
  .kicker { font-size: 12px; letter-spacing: .04em; color: var(--ink-soft); margin: 0 0 4px; }
  h1 {
    font-family: 'Shippori Mincho', serif;
    font-weight: 700;
    font-size: 28px;
    margin: 0 0 6px;
    line-height: 1.3;
  }
  .sub { font-size: 13px; color: var(--ink-soft); margin: 0; }

  .stats {
    display: flex;
    gap: 10px;
    margin: 20px 0;
    overflow-x: auto;
  }
  .stat-box {
    flex: 1;
    min-width: 110px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    padding: 12px 14px;
  }
  .stat-box .num {
    font-family: 'Shippori Mincho', serif;
    font-size: 22px;
    font-variant-numeric: tabular-nums;
  }
  .stat-box .lbl { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }

  .tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
    padding-bottom: 12px;
    margin-bottom: 6px;
  }
  .tab {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 13px;
    padding: 6px 12px;
    cursor: pointer;
  }
  .tab.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .add-btn {
    display: block;
    width: 100%;
    margin: 14px 0 0;
    padding: 12px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    font-family: 'Shippori Mincho', serif;
    font-size: 15px;
    cursor: pointer;
    letter-spacing: .02em;
  }
  .add-btn:active { opacity: .85; }

  .panel {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    margin-top: 12px;
    padding: 16px;
    display: none;
  }
  .panel.open { display: block; }
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--line);
    background: #fff;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
  }
  .field textarea { resize: vertical; min-height: 50px; }
  .row2 { display: flex; gap: 10px; }
  .row2 > div { flex: 1; }

  .status-toggle { display: flex; gap: 8px; margin-bottom: 12px; }
  .status-toggle button {
    flex: 1;
    padding: 9px;
    border: 1px solid var(--line);
    background: #fff;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    color: var(--ink-soft);
  }
  .status-toggle button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .panel-actions { display: flex; gap: 8px; margin-top: 4px; }
  .btn-save {
    flex: 1;
    padding: 10px;
    background: var(--gold);
    color: #fff;
    border: none;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-cancel {
    padding: 10px 16px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    font-family: inherit;
    cursor: pointer;
  }

  .list { margin-top: 8px; }
  .item {
    display: flex;
    border-bottom: 1px solid var(--line);
    padding: 14px 0;
    gap: 12px;
  }
  .item .bar { width: 4px; flex-shrink: 0; border-radius: 2px; }
  .item .body { flex: 1; min-width: 0; }
  .item .top-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .item .name {
    font-family: 'Shippori Mincho', serif;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.4;
  }
  .item .price {
    font-variant-numeric: tabular-nums;
    font-size: 14px;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .item .brand { font-size: 13px; color: var(--ink-soft); margin-top: 1px; }
  .item .meta {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 6px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .tag {
    display: inline-block;
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 2px;
  }
  .item .notes { font-size: 13px; margin-top: 6px; color: var(--ink); }
  .item .del {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
    margin-top: 6px;
  }

  .empty {
    padding: 40px 10px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
  }
  .empty .big { font-family: 'Shippori Mincho', serif; font-size: 17px; color: var(--ink); margin-bottom: 6px; }

  .loading { padding: 30px; text-align: center; color: var(--ink-soft); font-size: 13px; }

  .photo-field { margin-bottom: 12px; }
  .photo-input-btn {
    display: inline-block;
    padding: 9px 14px;
    border: 1px solid var(--line);
    background: #fff;
    font-family: inherit;
    font-size: 13px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .photo-preview-wrap { margin-top: 8px; position: relative; display: inline-block; }
  .photo-preview-wrap img {
    max-width: 140px;
    max-height: 140px;
    display: block;
    border: 1px solid var(--line);
  }
  .photo-remove {
    position: absolute;
    top: -8px;
    right: -8px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    font-size: 13px;
    cursor: pointer;
    line-height: 1;
  }
  .item .thumb {
    width: 56px;
    height: 56px;
    object-fit: cover;
    border: 1px solid var(--line);
    flex-shrink: 0;
  }
</style>

<div class="wrap">
  <header class="top">
    <p class="kicker">HOBBY COLLECTION LOG</p>
    <h1>コレクション台帳</h1>
    <p class="sub">所有アイテムと購入履歴(日付・価格・購入先)を記録します</p>
  </header>

  <div class="stats" id="stats"></div>

  <div class="tabs" id="tabs"></div>

  <button class="add-btn" id="toggleAdd">+ アイテムを追加</button>

  <div class="panel" id="panel">
    <div class="field">
      <label>カテゴリ</label>
      <select id="f-category">
        <option value="レコード">レコード</option>
        <option value="本・マンガ">本・マンガ</option>
        <option value="ファッション">ファッション</option>
        <option value="その他">その他</option>
        <option value="__custom">＋ 新しいカテゴリを入力</option>
      </select>
    </div>
    <div class="field" id="f-category-custom-wrap" style="display:none">
      <label>新しいカテゴリ名</label>
      <input type="text" id="f-category-custom" placeholder="例: フィギュア">
    </div>
    <div class="field">
      <label>タイトル・品名</label>
      <input type="text" id="f-name" placeholder="例: Kind of Blue">
    </div>
    <div class="field">
      <label>アーティスト・ブランドなど(任意)</label>
      <input type="text" id="f-brand" placeholder="例: Miles Davis">
    </div>

    <div class="status-toggle">
      <button type="button" class="on" id="s-existing">既存所有(購入情報なし)</button>
      <button type="button" id="s-new">新規購入(記録あり)</button>
    </div>

    <div id="purchase-fields">
      <div class="row2">
        <div class="field">
          <label>購入日</label>
          <input type="date" id="f-date">
        </div>
        <div class="field">
          <label>価格(円)</label>
          <input type="number" id="f-price" placeholder="例: 3200">
        </div>
      </div>
      <div class="field">
        <label>購入場所</label>
        <input type="text" id="f-place" placeholder="例: ディスクユニオン熊本店 / メルカリ">
      </div>
    </div>

    <div class="field">
      <label>メモ(任意・ブログのネタ帳として)</label>
      <textarea id="f-notes" placeholder="思い入れ、状態、エピソードなど"></textarea>
    </div>

    <div class="photo-field">
      <label style="display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px;">写真(任意)</label>
      <input type="file" id="f-photo" accept="image/*" capture="environment" style="display:none">
      <button type="button" class="photo-input-btn" id="photoPickBtn">写真を選ぶ・撮影する</button>
      <div id="photoPreviewArea"></div>
    </div>

    <div class="panel-actions">
      <button class="btn-save" id="saveItem">保存する</button>
      <button class="btn-cancel" id="cancelAdd">キャンセル</button>
    </div>
  </div>

  <div class="list" id="list">
    <div class="loading">読み込み中...</div>
  </div>
</div>

<script>
const CATS = ["レコード", "本・マンガ", "ファッション", "その他"];
const CAT_COLOR = {
  "レコード": { bar: "var(--teal)", bg: "var(--teal-bg)", fg: "var(--teal)" },
  "本・マンガ": { bar: "var(--gold)", bg: "var(--gold-bg)", fg: "var(--gold)" },
  "ファッション": { bar: "var(--rose)", bg: "var(--rose-bg)", fg: "var(--rose)" },
  "その他": { bar: "var(--grey)", bg: "var(--grey-bg)", fg: "var(--grey)" }
};
function colorFor(cat) {
  return CAT_COLOR[cat] || { bar: "var(--grey)", bg: "var(--grey-bg)", fg: "var(--grey)" };
}

let items = [];
let activeTab = "すべて";
let newStatus = "existing";
let pendingPhoto = null;
const STORAGE_KEY = "collection-items";
const MAX_DIM = 640;
const JPEG_QUALITY = 0.7;

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      let { width, height } = img;
      if (width > MAX_DIM || height > MAX_DIM) {
        if (width > height) {
          height = Math.round(height * (MAX_DIM / width));
          width = MAX_DIM;
        } else {
          width = Math.round(width * (MAX_DIM / height));
          height = MAX_DIM;
        }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL("image/jpeg", JPEG_QUALITY));
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderPhotoPreview() {
  const area = document.getElementById("photoPreviewArea");
  if (!pendingPhoto) {
    area.innerHTML = "";
    return;
  }
  area.innerHTML = `
    <div class="photo-preview-wrap">
      <img src="${pendingPhoto}">
      <button type="button" class="photo-remove" id="removePhotoBtn">×</button>
    </div>
  `;
  document.getElementById("removePhotoBtn").addEventListener("click", () => {
    pendingPhoto = null;
    document.getElementById("f-photo").value = "";
    renderPhotoPreview();
  });
}

async function loadItems() {
  try {
    const res = await window.storage.get(STORAGE_KEY, false);
    items = res && res.value ? JSON.parse(res.value) : [];
  } catch (e) {
    items = [];
  }
  render();
}

async function saveItems() {
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify(items), false);
  } catch (e) {
    console.error("save failed", e);
  }
}

function allCategories() {
  const dynamic = [...new Set(items.map(i => i.category))];
  const merged = [...new Set([...CATS, ...dynamic])];
  return merged;
}

function fmtYen(n) {
  if (n === null || n === undefined || n === "") return "";
  return "¥" + Number(n).toLocaleString("ja-JP");
}

function renderStats() {
  const total = items.length;
  const thisYear = new Date().getFullYear();
  const spentThisYear = items
    .filter(i => i.status === "new" && i.price && i.date && new Date(i.date).getFullYear() === thisYear)
    .reduce((s, i) => s + Number(i.price), 0);
  const totalSpent = items
    .filter(i => i.status === "new" && i.price)
    .reduce((s, i) => s + Number(i.price), 0);

  document.getElementById("stats").innerHTML = `
    <div class="stat-box"><div class="num">${total}</div><div class="lbl">総アイテム数</div></div>
    <div class="stat-box"><div class="num">${fmtYen(spentThisYear) || "¥0"}</div><div class="lbl">${thisYear}年の購入額</div></div>
    <div class="stat-box"><div class="num">${fmtYen(totalSpent) || "¥0"}</div><div class="lbl">記録済み購入総額</div></div>
  `;
}

function renderTabs() {
  const cats = allCategories();
  const tabsEl = document.getElementById("tabs");
  const all = ["すべて", ...cats];
  tabsEl.innerHTML = all.map(c =>
    `<button class="tab ${c === activeTab ? "active" : ""}" data-cat="${c}">${c}</button>`
  ).join("");
  tabsEl.querySelectorAll(".tab").forEach(btn => {
    btn.addEventListener("click", () => {
      activeTab = btn.dataset.cat;
      render();
    });
  });
}

function renderList() {
  const listEl = document.getElementById("list");
  let filtered = activeTab === "すべて" ? items : items.filter(i => i.category === activeTab);
  filtered = [...filtered].sort((a, b) => {
    const da = a.date || a.createdAt;
    const db = b.date || b.createdAt;
    return db.localeCompare(da);
  });

  if (filtered.length === 0) {
    listEl.innerHTML = `<div class="empty"><div class="big">まだ記録がありません</div>「+ アイテムを追加」から最初の1件を記録しましょう</div>`;
    return;
  }

  listEl.innerHTML = filtered.map(i => {
    const c = colorFor(i.category);
    const metaBits = [];
    if (i.status === "new") {
      if (i.date) metaBits.push(i.date);
      if (i.place) metaBits.push(i.place);
    } else {
      metaBits.push("既存所有");
    }
    return `
      <div class="item">
        <div class="bar" style="background:${c.bar}"></div>
        ${i.photo ? `<img class="thumb" src="${i.photo}">` : ""}
        <div class="body">
          <div class="top-row">
            <div>
              <div class="name">${escapeHtml(i.name)}</div>
              ${i.brand ? `<div class="brand">${escapeHtml(i.brand)}</div>` : ""}
            </div>
            <div class="price">${i.status === "new" ? fmtYen(i.price) : ""}</div>
          </div>
          <div class="meta">
            <span class="tag" style="background:${c.bg};color:${c.fg}">${escapeHtml(i.category)}</span>
            ${metaBits.map(m => `<span>${escapeHtml(m)}</span>`).join("")}
          </div>
          ${i.notes ? `<div class="notes">${escapeHtml(i.notes)}</div>` : ""}
          <button class="del" data-id="${i.id}">削除</button>
        </div>
      </div>
    `;
  }).join("");

  listEl.querySelectorAll(".del").forEach(btn => {
    btn.addEventListener("click", async () => {
      items = items.filter(i => i.id !== btn.dataset.id);
      await saveItems();
      render();
    });
  });
}

function escapeHtml(s) {
  if (s === undefined || s === null) return "";
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

function render() {
  renderStats();
  renderTabs();
  renderList();
}

function resetForm() {
  document.getElementById("f-category").value = "レコード";
  document.getElementById("f-category-custom-wrap").style.display = "none";
  document.getElementById("f-category-custom").value = "";
  document.getElementById("f-name").value = "";
  document.getElementById("f-brand").value = "";
  document.getElementById("f-date").value = "";
  document.getElementById("f-price").value = "";
  document.getElementById("f-place").value = "";
  document.getElementById("f-notes").value = "";
  document.getElementById("f-photo").value = "";
  pendingPhoto = null;
  renderPhotoPreview();
  setStatus("existing");
}

function setStatus(s) {
  newStatus = s;
  document.getElementById("s-existing").classList.toggle("on", s === "existing");
  document.getElementById("s-new").classList.toggle("on", s === "new");
  document.getElementById("purchase-fields").style.display = s === "new" ? "block" : "none";
}

document.getElementById("toggleAdd").addEventListener("click", () => {
  document.getElementById("panel").classList.add("open");
  document.getElementById("toggleAdd").style.display = "none";
});
document.getElementById("cancelAdd").addEventListener("click", () => {
  document.getElementById("panel").classList.remove("open");
  document.getElementById("toggleAdd").style.display = "block";
  resetForm();
});
document.getElementById("s-existing").addEventListener("click", () => setStatus("existing"));
document.getElementById("s-new").addEventListener("click", () => setStatus("new"));
document.getElementById("photoPickBtn").addEventListener("click", () => {
  document.getElementById("f-photo").click();
});
document.getElementById("f-photo").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    pendingPhoto = await compressImage(file);
    renderPhotoPreview();
  } catch (err) {
    alert("写真の読み込みに失敗しました");
  }
});
document.getElementById("f-category").addEventListener("change", (e) => {
  document.getElementById("f-category-custom-wrap").style.display =
    e.target.value === "__custom" ? "block" : "none";
});

document.getElementById("saveItem").addEventListener("click", async () => {
  const name = document.getElementById("f-name").value.trim();
  if (!name) {
    alert("タイトル・品名を入力してください");
    return;
  }
  let category = document.getElementById("f-category").value;
  if (category === "__custom") {
    category = document.getElementById("f-category-custom").value.trim();
    if (!category) {
      alert("新しいカテゴリ名を入力してください");
      return;
    }
  }
  const item = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    category,
    name,
    brand: document.getElementById("f-brand").value.trim(),
    status: newStatus,
    date: newStatus === "new" ? document.getElementById("f-date").value : "",
    price: newStatus === "new" ? document.getElementById("f-price").value : "",
    place: newStatus === "new" ? document.getElementById("f-place").value.trim() : "",
    notes: document.getElementById("f-notes").value.trim(),
    photo: pendingPhoto || "",
    createdAt: new Date().toISOString()
  };
  items.push(item);
  try {
    await saveItems();
  } catch (err) {
    alert("保存に失敗しました。写真のサイズが大きすぎる可能性があります。");
    items.pop();
    return;
  }
  document.getElementById("panel").classList.remove("open");
  document.getElementById("toggleAdd").style.display = "block";
  resetForm();
  render();
});

loadItems();
</script>
